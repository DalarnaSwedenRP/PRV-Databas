<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>DSR Varumärkesregister</title>
<style>
  /* --- Grundlayout --- */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    margin: 0;
    padding: 0;
    color: #333;
  }

  h1 {
    text-align: center;
    padding: 30px 10px 10px 10px;
    color: #1a1a1a;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background-color: rgba(255,255,255,0.9);
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }

  /* --- Inputs & Knapp --- */
  input, select, button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.3s;
  }

  input:focus, select:focus {
    border-color: #74ebd5;
    box-shadow: 0 0 5px #74ebd5;
  }

  button {
    background-color: #74ebd5;
    border: none;
    cursor: pointer;
    color: #fff;
    font-weight: bold;
  }

  button:hover {
    background-color: #66d0c0;
  }

  /* --- Resultatlista --- */
  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background-color: #f1f1f1;
    margin: 8px 0;
    padding: 12px 15px;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    transition: 0.2s;
  }

  li:hover {
    background-color: #e0f7fa;
  }

  /* --- Filterrad --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }

  .filters input, .filters select {
    flex: 1;
    min-width: 150px;
  }
</style>
</head>
<body>

<h1>Dalarna Sweden RP - Varumärkesregister</h1>

<div class="container">
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Sök varumärke">
    <select id="lanSelect" onchange="updateKommuner()">
      <option value="">Alla län</option>
    </select>
    <select id="kommunSelect">
      <option value="">Alla kommuner</option>
    </select>
    <button onclick="search()">Sök</button>
  </div>

  <ul id="results"></ul>
</div>

<script>
let brands = [];
let lanList = [];
let kommunList = [];

// Ladda data.json
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    brands = data;
    populateLans();
  });

function populateLans() {
  const lanSelect = document.getElementById('lanSelect');
  lanList = [...new Set(brands.map(b => b.lan))];
  lanList.forEach(lan => {
    const option = document.createElement('option');
    option.value = lan;
    option.textContent = lan;
    lanSelect.appendChild(option);
  });
}

function updateKommuner() {
  const selectedLan = document.getElementById('lanSelect').value;
  const kommunSelect = document.getElementById('kommunSelect');
  kommunSelect.innerHTML = '<option value="">Alla kommuner</option>';

  kommunList = [...new Set(brands
    .filter(b => !selectedLan || b.lan === selectedLan)
    .map(b => b.kommun))];

  kommunList.forEach(k => {
    const option = document.createElement('option');
    option.value = k;
    option.textContent = k;
    kommunSelect.appendChild(option);
  });
}

function search() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const selectedLan = document.getElementById('lanSelect').value;
  const selectedKommun = document.getElementById('kommunSelect').value;
  const resultsList = document.getElementById('results');
  resultsList.innerHTML = '';

  const results = brands.filter(b => {
    return (!query || b.varumarke.toLowerCase().includes(query)) &&
           (!selectedLan || b.lan === selectedLan) &&
           (!selectedKommun || b.kommun === selectedKommun);
  });

  if (results.length === 0) {
    resultsList.innerHTML = '<li>Inga varumärken hittades</li>';
  } else {
    results.forEach(b => {
      const li = document.createElement('li');
      li.textContent = `${b.varumarke} - Ägare: ${b.agare} - Status: ${b.status} - Registrerat: ${b.registreringsdatum} - ${b.lan}, ${b.kommun}`;
      resultsList.appendChild(li);
    });
  }
}
</script>

</body>
</html>
